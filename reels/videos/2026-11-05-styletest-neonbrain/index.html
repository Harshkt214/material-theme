<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Style test: NEON BRAIN — glowing line-art brain, each bias lights a region */
      @font-face { font-family: "Baloo 2"; font-weight: 800; src: url("assets/fonts/baloo-2-latin-800-normal.woff2") format("woff2"); }
      :root { --bg: #0e1424; --green: #26d07c; --red: #ff4d5e; --yellow: #ffc94a; --orange: #ff8a3d; --ink: #eef1f8; --muted: #8d97ad; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", sans-serif; color: var(--ink); }
      #bgc { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 50%, #142038, var(--bg) 75%); }
      #stars { position: absolute; inset: 0; }
      .cap { position: absolute; left: 108px; width: 864px; text-align: center; font-family: "Baloo 2", sans-serif; font-weight: 800; line-height: 0.95; white-space: nowrap; }
      .lab { position: absolute; padding: 14px 26px; border-radius: 18px; font-weight: 800; font-size: 40px; border: 3px solid; background: rgba(14, 20, 36, 0.85); white-space: nowrap; }
      #brand { position: absolute; left: 108px; top: 196px; display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 28px; letter-spacing: 0.1em; }
      #brand img { width: 64px; height: 64px; border-radius: 50%; }
      #brain path, #brain ellipse { vector-effect: non-scaling-stroke; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <div id="bgc"></div>
      <svg id="stars" width="1080" height="1920"></svg>
      <div id="brand"><img src="assets/tw-icon.svg" />THE TRADING WIZAARD</div>

      <div id="scene" class="clip" data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics" style="position: absolute; inset: 0">
        <!-- brain: same silhouette as the logo, drawn as neon line art -->
        <svg id="brain" style="position: absolute; left: 140px; top: 640px" width="800" height="700" viewBox="30 50 160 140">
          <defs>
            <radialGradient id="gR"><stop offset="0" stop-color="#ff4d5e" stop-opacity="0.95" /><stop offset="1" stop-color="#ff4d5e" stop-opacity="0" /></radialGradient>
            <radialGradient id="gO"><stop offset="0" stop-color="#ff8a3d" stop-opacity="0.95" /><stop offset="1" stop-color="#ff8a3d" stop-opacity="0" /></radialGradient>
            <radialGradient id="gY"><stop offset="0" stop-color="#ffc94a" stop-opacity="0.95" /><stop offset="1" stop-color="#ffc94a" stop-opacity="0" /></radialGradient>
          </defs>
          <circle id="z1" cx="78" cy="108" r="26" fill="url(#gR)" opacity="0" />
          <circle id="z2" cx="132" cy="96" r="26" fill="url(#gO)" opacity="0" />
          <circle id="z3" cx="104" cy="138" r="24" fill="url(#gY)" opacity="0" />
          <g id="lines" fill="none" stroke="#26d07c" style="filter: drop-shadow(0 0 6px rgba(38,208,124,0.9))">
            <path d="M118 176 L112 156 M132 176 L126 156" stroke-width="5" />
            <ellipse cx="138" cy="148" rx="22" ry="14" stroke-width="5" fill="rgba(38,208,124,0.04)" />
            <path id="outline" d="M50 128 Q42 96 66 82 Q78 66 104 70 Q132 64 150 84 Q170 96 164 122 Q166 144 142 148 Q120 160 96 154 Q70 160 58 146 Q46 140 50 128Z" stroke-width="7" fill="rgba(38,208,124,0.05)" />
            <g stroke-width="4" stroke-opacity="0.75" stroke-linecap="round">
              <path d="M70 92 Q80 102 72 114 Q66 124 76 132" />
              <path d="M96 78 Q104 92 96 104 Q90 116 102 126 Q112 136 104 148" />
              <path d="M126 76 Q122 92 132 100 Q142 108 136 122" />
              <path d="M150 96 Q144 108 154 118" />
              <path d="M60 132 Q72 140 86 136" />
              <path d="M116 132 Q128 138 146 134" />
            </g>
          </g>
          <!-- travelling signal along the outline -->
          <path id="signal" d="M50 128 Q42 96 66 82 Q78 66 104 70 Q132 64 150 84 Q170 96 164 122 Q166 144 142 148 Q120 160 96 154 Q70 160 58 146 Q46 140 50 128Z" fill="none" stroke="#eef1f8" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 400" style="filter: drop-shadow(0 0 8px #fff)" />
        </svg>

        <!-- callout lines in screen space -->
        <svg style="position: absolute; left: 0; top: 0" width="1080" height="1920">
          <line id="k1" x1="380" y1="930" x2="250" y2="1230" stroke="#ff4d5e" stroke-width="4" />
          <line id="k2" x1="650" y1="870" x2="800" y2="670" stroke="#ff8a3d" stroke-width="4" />
          <line id="k3" x1="510" y1="1080" x2="760" y2="1230" stroke="#ffc94a" stroke-width="4" />
        </svg>
        <div id="l1" class="lab" style="left: 108px; top: 1230px; color: var(--red); border-color: var(--red)">SL hatana</div>
        <div id="l2" class="lab" style="left: 600px; top: 600px; color: var(--orange); border-color: var(--orange)">Revenge trade</div>
        <div id="l3" class="lab" style="left: 600px; top: 1230px; color: var(--yellow); border-color: var(--yellow)">Overtrading</div>

        <div id="c1" class="cap" style="top: 330px; font-size: 96px">Phir bhi…</div>
        <div id="c2" class="cap" style="top: 300px; font-size: 230px; color: var(--red); text-shadow: 0 0 50px rgba(255,77,94,0.7)">LOSS</div>
        <div id="c3" class="cap" style="top: 300px; font-size: 64px">Kyunki asli problem hai</div>
        <div id="c4" class="cap" style="top: 380px; font-size: 150px; color: var(--yellow); text-shadow: 0 0 50px rgba(255,201,74,0.6)">BEHAVIOUR</div>
      </div>

      <audio id="vo" class="clip" src="assets/vo.mp3" data-start="0" data-media-start="12.98" data-duration="7.22" data-track-index="10" data-volume="1"></audio>
      <audio id="im" class="clip" src="assets/sfx/impact.mp3" data-start="0.77" data-duration="0.9" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sl" class="clip" src="assets/sfx/impact.mp3" data-start="3.12" data-duration="0.9" data-track-index="12" data-volume="0.38"></audio>
      <audio id="p1" class="clip" src="assets/sfx/pop.mp3" data-start="4.15" data-duration="0.12" data-track-index="13" data-volume="0.3"></audio>
      <audio id="p2" class="clip" src="assets/sfx/pop.mp3" data-start="5.09" data-duration="0.12" data-track-index="13" data-volume="0.3"></audio>
      <audio id="p3" class="clip" src="assets/sfx/pop.mp3" data-start="5.95" data-duration="0.12" data-track-index="13" data-volume="0.3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // deterministic star field
      (function () { let s = 77; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647); let h = "";
        for (let i = 0; i < 90; i++) h += `<circle class="st" cx="${r() * 1080}" cy="${r() * 1920}" r="${1 + r() * 2.5}" fill="#eef1f8" opacity="${0.15 + r() * 0.35}"/>`;
        document.getElementById("stars").innerHTML = h; })();

      const tl = gsap.timeline({ paused: true });
      // ambient: signal travels, brain breathes, stars drift
      tl.fromTo("#signal", { strokeDashoffset: 0 }, { strokeDashoffset: -1650, duration: 8, ease: "none" }, 0);
      tl.fromTo("#brain", { scale: 0.97, transformOrigin: "50% 50%" }, { scale: 1.03, duration: 4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#stars", { y: 0 }, { y: -120, duration: 8, ease: "none" }, 0);

      // captions (frame 0: "Phir bhi…" + brain already on screen)
      tl.to("#c1", { opacity: 0, duration: 0.12 }, 0.7);
      tl.fromTo("#c2", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.in" }, 0.77);
      tl.to("#c2", { opacity: 0, duration: 0.15 }, 1.6);
      tl.fromTo("#c3", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 1.75);
      tl.fromTo("#c4 ", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 3.12);

      // LOSS: brain flickers red
      [["#ff4d5e", 0.77], ["#26d07c", 0.84], ["#ff4d5e", 0.9], ["#26d07c", 1.4]].forEach(([c, t]) => tl.set("#lines", { stroke: c }, t));
      [12, -10, 7, -3, 0].forEach((x, i) => tl.to("#brain", { x, duration: 1 / 30 }, 0.8 + i / 30));
      // BEHAVIOUR: brain pulses yellow once
      tl.to("#lines", { stroke: "#ffc94a", duration: 0.15 }, 3.12).to("#lines", { stroke: "#26d07c", duration: 0.5 }, 3.5);

      // regions light on their words, with callouts
      const light = (z, k, l, t) => {
        tl.fromTo(z, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, t);
        tl.to(z, { opacity: 0.7, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, t + 0.4);
        tl.fromTo(k, { strokeDasharray: 400, strokeDashoffset: 400 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t + 0.05);
        tl.fromTo(l, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, t + 0.2);
      };
      light("#z1", "#k1", "#l1", 4.15);
      light("#z2", "#k2", "#l2", 5.09);
      light("#z3", "#k3", "#l3", 5.95);

      tl.set({}, {}, 8);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
